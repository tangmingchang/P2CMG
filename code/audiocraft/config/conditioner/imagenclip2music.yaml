# @package __global__

classifier_free_guidance:
  training_dropout: 0.3
  inference_coef: 3.0

attribute_dropout: {}

fuser:
  cross_attention_pos_emb: false
  cross_attention_pos_emb_scale: 1
  sum: []
  prepend: []
  cross: [description, image_clip]
  input_interpolate: []

conditioners:
  image_clip:
    model: clip_image
    clip_image:
      name: openai/clip-vit-base-patch32
      autocast_dtype: float32
      image_size: 224
  description:
    model: t5
    t5:
      name: t5-base
      finetune: false
      word_dropout: 0.3
      normalize_text: false

dataset:
  train:
    merge_text_p: 0.0
    drop_desc_p: 0.0
    drop_other_p: 1.0
